name: Vigilante combustiveis

on:
  schedule:
    - cron: "17 */3 * * *"  # de 3 em 3 horas
  workflow_dispatch:       # permite correr manualmente

permissions:
  contents: write

jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Verificar precos
        run: python watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Guardar estado
        run: |
          git config user.name "vigilante"
          git config user.email "vigilante@users.noreply.github.com"
          git add estado.json
          git commit -m "Atualizar estado [skip ci]" || exit 0
          git push
