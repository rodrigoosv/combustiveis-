name: Vigilante combustiveis

on:
  schedule:
    - cron: "17 * * * *"   # de hora a hora
  workflow_dispatch:       # permite correr manualmente

permissions:
  contents: write

concurrency:
  group: vigilante
  cancel-in-progress: false   # se uma execucao ainda estiver a correr, a seguinte espera

jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Verificar precos
        run: python watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Guardar estado
        run: |
          git config user.name "vigilante"
          git config user.email "vigilante@users.noreply.github.com"
          git add estado.json
          if [ -f historico.csv ]; then git add historico.csv; fi
          if [ -f grafico.svg ]; then git add grafico.svg; fi
          if [ -f index.html ]; then git add index.html; fi
          git commit -m "Atualizar estado [skip ci]" || exit 0
          git pull --rebase
          git push
